<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rsync GUI</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--fg:#1d1d1f;--mut:#6e6e73;--line:#e3e3e8;--acc:#0a66ff;--ok:#1a8f4c;--err:#d6322e;--warn:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--card:#2a2a2d;--fg:#f2f2f5;--mut:#9a9aa2;--line:#3a3a3e;--acc:#4c8dff;--ok:#43c077;--err:#ff6b66;--warn:#e0b050}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;padding:12px;overflow-x:hidden}
button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:3px 11px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--acc)}button.d{color:var(--err)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.top b{font-size:14px}
.t{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.n{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.s{font-size:12px;white-space:nowrap;padding-top:1px}
.running,.starting{color:var(--acc)}.retrying,.paused,.interrupted{color:var(--warn)}.done{color:var(--ok)}.error{color:var(--err)}
.file{margin-top:10px;overflow-wrap:anywhere;line-height:1.3}
.pb{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:7px 0}
.pb>i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
.t.isp .pb>i{background:var(--warn)}
.kv{display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.kv b{color:var(--fg);font-weight:500}
.tot{border-top:1px solid var(--line);margin-top:11px;padding-top:9px}
.tot .row{display:flex;justify-content:space-between;align-items:baseline}
.tot .row b{font-size:13px;font-variant-numeric:tabular-nums}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px}
.foot .c{color:var(--mut);font-size:12px}.b{display:flex;gap:6px}
.info{color:var(--mut);font-size:12px;margin-top:8px}.empty{color:var(--mut);text-align:center;padding:22px 0}
</style></head><body>
<div id="wrap">
<div class="top"><b>Rsync GUI</b><button onclick="window.webkit.messageHandlers.app.postMessage('expand')">Agrandir</button></div>
<div id="list"></div>
</div>
<script>
const T="__TOKEN__";const $=id=>document.getElementById(id);
const LAB={starting:"Démarrage",running:"En cours",retrying:"Reprise…",paused:"En pause",interrupted:"Interrompu",done:"Terminé",error:"Échec",stopped:"Arrêté"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const act=st=>["starting","running","retrying","paused"].includes(st);
const fmtS=b=>(b<1024?Math.round(b)+" o":b<1048576?(b/1024).toFixed(0)+" Ko":b<1073741824?(b/1048576).toFixed(1)+" Mo":(b/1073741824).toFixed(2)+" Go").replace(".",",");
const fmtDur=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return h?h+":"+String(m).padStart(2,"0")+":"+String(r).padStart(2,"0"):m+":"+String(r).padStart(2,"0")};
const fmtEta=s=>s<60?Math.max(1,Math.round(s))+" s":s<3600?"~"+Math.round(s/60)+" min":"~"+Math.floor(s/3600)+" h "+String(Math.round(s%3600/60)).padStart(2,"0");
const nb=n=>Number(n).toLocaleString("fr-FR");
const kv=(label,val)=>val?`<span>${label} <b>${val}</b></span>`:"";
function prog(x){const done=x.status==="done";
 if(x.planning&&!x.current&&!x.files&&!done)return '<div class="info">Démarrage… le total est calculé en arrière-plan.</div>';
 if(done&&x.total_files===0)return '<div class="info">Rien à copier : tout est déjà à jour.</div>';
 let h="";
 if(x.current||done){
  h+=`<div class="file">${esc(x.current||"")}</div><div class="pb"><i style="width:${done?100:x.percent}%"></i></div>
  <div class="kv">${kv("",x.cur_size?fmtS(x.cur_bytes)+" / "+fmtS(x.cur_size):"")}${kv("",x.cur_speed?fmtS(x.cur_speed)+"/s":"")}${x.cur_elapsed?kv("écoulé",fmtDur(x.cur_elapsed)):""}${x.cur_eta!=null?kv("restant",fmtDur(x.cur_eta)):""}</div>`}
 if(x.total_files>1){const pct=x.overall>=0?x.overall:0;
  h+=`<div class="tot"><div class="row"><b>Total</b><b>${done?100:pct}%</b></div><div class="pb"><i style="width:${done?100:pct}%"></i></div>
  <div class="kv">${kv("",nb(x.files_done)+" / "+nb(x.total_files)+" fichiers")}${x.total_dirs>0?kv("",nb(x.dirs_done)+" / "+nb(x.total_dirs)+" dossiers"):""}</div>
  <div class="kv">${x.total_bytes?kv("",fmtS(x.done_bytes)+" / "+fmtS(x.total_bytes)):""}${x.avg_speed?kv("moy.",fmtS(x.avg_speed)+"/s"):""}${x.total_eta!=null&&!done?kv("restant",fmtEta(x.total_eta)):""}</div></div>`}
 else if(x.planning&&!done)h+=`<div class="info">${x.files_done} fichier(s) copié(s) · calcul du total en cours…</div>`;
 return h}
async function call(a,id){await fetch("/api/"+a,{method:"POST",headers:{"X-Token":T,"Content-Type":"application/json"},body:JSON.stringify({id})});tick()}
let lastH=0;
function fit(){const h=Math.ceil($("wrap").getBoundingClientRect().height)+24;
 if(Math.abs(h-lastH)>=6){lastH=h;try{window.webkit.messageHandlers.app.postMessage({h})}catch(e){}}}
async function tick(){try{const r=await fetch("/api/state",{headers:{"X-Token":T}});const d=await r.json();
 const runs=Object.entries(d.runs).sort((a,b)=>(act(b[1].status)-act(a[1].status))).slice(0,4);
 $("list").innerHTML=runs.length?runs.map(([id,x])=>`<div class="t${x.status==="paused"?" isp":""}"><div class="head"><span class="n">${esc(x.name)}</span>
 <span class="s ${x.status}">${LAB[x.status]}${x.attempt>1&&act(x.status)?" · essai "+x.attempt:""}</span></div>
 ${prog(x)}<div class="foot"><span class="c">${fmtDur(x.elapsed)} au total</span>
 <span class="b">${x.status==="running"?`<button onclick="call('pause','${id}')">⏸ Pause</button>`:x.status==="paused"?`<button onclick="call('resume','${id}')">▶ Reprendre</button>`:""}${act(x.status)?`<button class="d" onclick="call('stop','${id}')">Arrêter</button>`:""}</span></div></div>`).join(""):'<div class="empty">Aucun transfert.</div>';
 fit()}catch(e){}}
tick();setInterval(tick,500);
</script></body></html>
